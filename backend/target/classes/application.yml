server:
  port: 8085
  error:
    # Never expose raw exception text to clients (see GlobalExceptionHandler).
    include-message: never
    include-stacktrace: never

# ---------------------------------------------------------------------------
# DB switch (single knob):
#   CAITS_DB=1  → schema caits_local (full data clone / legacy)
#   CAITS_DB=2  → schema caits      (structure + admin)   ← default
#
# Examples:
#   PowerShell:  $env:CAITS_DB = "1"; mvn spring-boot:run
#   Or edit below: spring.profiles.active: "1"
# ---------------------------------------------------------------------------
spring:
  application:
    name: caits-backend
  profiles:
    active: ${CAITS_DB:2}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 120000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: true
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

caits:
  security:
    # Override via CAITS_SECURITY_JWT_SECRET in production — never commit real secrets.
    jwt-secret: ${CAITS_SECURITY_JWT_SECRET:CAITS_Local_Dev_Secret_Change_Me_32chars_Min_Length_Required!!}
    jwt-expiration-seconds: 3600
    # AES key material for S3 field encryption (PAN/GSTIN). Override in production.
    field-encryption-key: ${CAITS_SECURITY_FIELD_ENCRYPTION_KEY:CAITS_DEV_FIELD_KEY_CHANGE_ME_32+}
    # false for local HTTP; set CAITS_SECURITY_COOKIE_SECURE=true behind HTTPS.
    cookie-secure: ${CAITS_SECURITY_COOKIE_SECURE:false}
    # Lax for Vite proxy/local; use Strict in production same-site HTTPS.
    cookie-same-site: ${CAITS_SECURITY_COOKIE_SAME_SITE:Lax}
    # Roles that bypass OU / Location scoping and see every record.
    location-scope-exempt-roles: ADMIN
    # Self-signed HTTPS for LAN servers without a purchased certificate.
    # Browsers require HTTPS (or localhost) for Windows/OS push notifications.
    # Embedded Tomcat: CAITS_TLS_ENABLED=true  (optional CAITS_TLS_HOST=192.168.x.x, CAITS_TLS_PORT=8443)
    # Keystore is auto-created at {upload-dir}/caits-tls.p12 (password: caits-tls).
    # External Tomcat: point an HTTPS connector at that PKCS12 file instead.
    tls:
      enabled: ${CAITS_TLS_ENABLED:false}
      # When true (e.g. WAR on external Tomcat), only create uploads/caits-tls.p12 for the connector.
      prepare-keystore: ${CAITS_TLS_PREPARE_KEYSTORE:false}
      host: ${CAITS_TLS_HOST:localhost}
      port: ${CAITS_TLS_PORT:0}
      keystore: ${CAITS_TLS_KEYSTORE:}
  cors:
    # Dev Vite + Tomcat same-origin. On LAN server include https://YOUR_IP:PORT (and http if needed).
    # Use "*" to allow any browser origin for API CORS / WebSocket (auth still required).
    allowed-origins: "${CAITS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}"
  storage:
    upload-dir: "${CAITS_STORAGE_UPLOAD_DIR:./uploads}"

logging:
  file:
    name: ${CAITS_LOG_FILE:./logs/caits-app.log}
  level:
    com.caits: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO
