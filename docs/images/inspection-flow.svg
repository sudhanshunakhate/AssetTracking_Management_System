<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Inspection workflow">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a6b73"/>
    </marker>
  </defs>
  <rect width="900" height="280" rx="16" fill="#fffaf3"/>
  <text x="28" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#8a4b12">Inspection needed workflow</text>
  <text x="28" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9a6a3a">Triggered from GRN or Gatepass Inward when Item Master flag is set</text>

  <rect x="28" y="100" width="130" height="70" rx="12" fill="#0d7377"/>
  <text x="93" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">GRN / GPI</text>
  <text x="93" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#d6f3f4">Submit accepted</text>

  <path d="M158 135 L190 135" stroke="#5a6b73" stroke-width="2" marker-end="url(#a)"/>

  <rect x="198" y="100" width="130" height="70" rx="12" fill="#c45c26"/>
  <text x="263" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Quarantine</text>
  <text x="263" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#ffe8d6">Hold for QC</text>

  <path d="M328 135 L360 135" stroke="#5a6b73" stroke-width="2" marker-end="url(#a)"/>

  <rect x="368" y="100" width="150" height="70" rx="12" fill="#b8860b"/>
  <text x="443" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Inspection</text>
  <text x="443" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#fff3c4">Pending approval</text>

  <path d="M518 120 L560 90" stroke="#2f9e44" stroke-width="2" marker-end="url(#a)"/>
  <path d="M518 150 L560 180" stroke="#c92a2a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="568" y="60" width="140" height="56" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="638" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#2f9e44">Approve</text>
  <text x="638" y="103" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2f9e44">� Home store</text>

  <rect x="568" y="156" width="140" height="56" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
  <text x="638" y="181" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#c92a2a">Reject</text>
  <text x="638" y="199" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c92a2a">� Rejected store</text>

  <rect x="740" y="100" width="130" height="70" rx="12" fill="#fff" stroke="#868e96" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="805" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#495057">Inspector only</text>
  <text x="805" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#868e96">(+ ADMIN)</text>

  <text x="28" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7a5a35">Item must have Home Store set. Assign To Be Inspected By on the inbound document.</text>
</svg>
