<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Organization hierarchy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7f8"/>
      <stop offset="100%" stop-color="#e8eef2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="920" height="420" rx="16" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f3d45">Organization structure</text>
  <text x="40" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b73">How org, OU, locations, and system stores relate</text>

  <!-- Org -->
  <rect x="340" y="90" width="240" height="56" rx="12" fill="#0d7377" filter="url(#shadow)"/>
  <text x="460" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Organization</text>
  <text x="460" y="134" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#d6f3f4">Top entity</text>

  <line x1="460" y1="146" x2="460" y2="176" stroke="#7a9299" stroke-width="2"/>
  <line x1="200" y1="176" x2="720" y2="176" stroke="#7a9299" stroke-width="2"/>
  <line x1="200" y1="176" x2="200" y2="196" stroke="#7a9299" stroke-width="2"/>
  <line x1="460" y1="176" x2="460" y2="196" stroke="#7a9299" stroke-width="2"/>
  <line x1="720" y1="176" x2="720" y2="196" stroke="#7a9299" stroke-width="2"/>

  <!-- OUs -->
  <rect x="100" y="196" width="200" height="48" rx="10" fill="#14919b" filter="url(#shadow)"/>
  <text x="200" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Operating Unit A</text>
  <rect x="360" y="196" width="200" height="48" rx="10" fill="#14919b" filter="url(#shadow)"/>
  <text x="460" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Operating Unit B</text>
  <rect x="620" y="196" width="200" height="48" rx="10" fill="#14919b" filter="url(#shadow)"/>
  <text x="720" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Operating Unit C</text>

  <line x1="200" y1="244" x2="200" y2="274" stroke="#7a9299" stroke-width="2"/>
  <line x1="460" y1="244" x2="460" y2="274" stroke="#7a9299" stroke-width="2"/>

  <!-- Locations -->
  <rect x="70" y="274" width="120" height="44" rx="8" fill="#fff" stroke="#14919b" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="301" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d7377">Store / Location</text>
  <rect x="210" y="274" width="120" height="44" rx="8" fill="#fff" stroke="#14919b" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="301" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d7377">Store / Location</text>
  <rect x="400" y="274" width="120" height="44" rx="8" fill="#fff" stroke="#14919b" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="301" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d7377">Store / Location</text>

  <!-- System locations panel -->
  <rect x="560" y="268" width="320" height="120" rx="12" fill="#fff" stroke="#c45c26" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="580" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#c45c26">System locations (per Org)</text>
  <text x="580" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5560">MAIN_STORE � QUARANTINE</text>
  <text x="580" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5560">DAMAGED � SCRAP � REJECTED</text>
  <text x="580" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7a8790">Auto-seeded � special workflows</text>
</svg>
